<ellipse cx="24" cy="82" rx="15" ry="20" fill="#ffffff"/>
<circle cx="-24" cy="90" r="7" fill="#1e293b"/>
<circle cx="24" cy="90" r="7" fill="#1e293b"/>
<path d="M-18 122 Q0 108 18 122" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</g>

<rect x="470" y="390" width="60" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
<rect x="480" y="398" width="40" height="6" rx="2" fill="#94a3b8"/>
<rect x="480" y="410" width="40" height="6" rx="2" fill="#dc2626"/>
