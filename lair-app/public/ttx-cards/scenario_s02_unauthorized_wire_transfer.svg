<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img"><title>Unauthorized wire transfer illustration</title><desc>A caricature of a finance employee at a desk staring at a screen showing a fraudulent wire transfer email and a dollar amount.</desc>

<rect x="120" y="440" width="440" height="20" rx="4" fill="#94a3b8"/>

<rect x="230" y="260" width="220" height="170" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4"/>
<rect x="248" y="278" width="184" height="60" rx="4" fill="#dc2626"/>
<text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">from: "CFO"</text>
<text x="340" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">wire now, urgent</text>
<text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="500" fill="#dc2626">$340,000</text>
<rect x="290" y="420" width="100" height="10" rx="4" fill="#94a3b8"/>

<g transform="translate(180,300)">
<ellipse cx="0" cy="240" rx="90" ry="40" fill="#64748b"/>
